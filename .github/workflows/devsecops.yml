name: Pipeline DevSecOps - Cuidarte+

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. AUDITORÍA DE CALIDAD, DEPENDENCIAS (SCA) Y BUILD
  calidad-y-sca:
    name: 1. Linter, Build y Auditoría SCA
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y auditar vulnerabilidades (Backend)
        working-directory: ./BACKEND
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Instalar dependencias, Linter y Build (Frontend)
        working-directory: ./FRONTEND
        run: |
          npm ci
          npm run lint || true
          npm run build

  # 2. ESCANEO DE SEGURIDAD EN IMÁGENES DOCKER (TRIVY)
  seguridad-contenedores:
    name: 2. Escaneo de Vulnerabilidades Docker (Trivy)
    runs-on: ubuntu-latest
    needs: calidad-y-sca
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Construir imagen Docker Backend
        run: docker build -t cuidarteplus-backend:test ./BACKEND

      - name: Instalar y ejecutar Trivy (Bloquea si hay vulnerabilidades CRITICAL)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed cuidarteplus-backend:test

  # 3. PRUEBAS AUTOMATIZADAS FUNCIONALES Y DE SEGURIDAD API (DAST)
  pruebas-automatizadas-api:
    name: 3. Pruebas Automatizadas API y Seguridad
    runs-on: ubuntu-latest
    needs: seguridad-contenedores
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: cuidarteplus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inicializar Base de Datos PostgreSQL
        env:
          PGPASSWORD: postgres_ci_password
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d cuidarteplus -f ./BACKEND/sql/dump-cuidarteplus.sql

      - name: Iniciar API Backend en segundo plano
        working-directory: ./BACKEND
        env:
          PORT: 4000
          DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/cuidarteplus
          JWT_SECRET: clave_segura_para_pipeline_ci_2026
        run: |
          npm ci
          nohup npm start > backend.log 2>&1 &
          sleep 5

      - name: Ejecutar suite automatizada de seguridad y endpoints
        run: |
          echo "=== Prueba 1: Healthcheck API ==="
          curl -f http://localhost:4000/

          echo "=== Prueba 2: Rechazo de credenciales inválidas (HTTP 401) ==="
          STATUS_LOGIN=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/autenticacion/login \
            -H "Content-Type: application/json" \
            -d '{"nombre_usuario":"noexiste","password":"wrong"}')
          echo "Código recibido: $STATUS_LOGIN"
          if [ "$STATUS_LOGIN" -ne 401 ]; then exit 1; fi

          echo "=== Prueba 3: Protección de ruta /usuarios sin Token JWT (HTTP 401) ==="
          STATUS_RBAC=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/usuarios)
          echo "Código recibido: $STATUS_RBAC"
          if [ "$STATUS_RBAC" -ne 401 ]; then exit 1; fi